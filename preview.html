<!DOCTYPE html>
<html lang="zh" class="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型可用性监控</title>
<style>
:root { --primary:#14b8a6; --primary-600:#0d9488; --bg:#f5f7fa; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; --ok:#10b981; --fail:#ef4444; --empty:#e2e8f0; }
.dark { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --border:#334155; --empty:#334155; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:16px; font-size:16px; min-height:100vh; display:flex; }
.wrap { max-width:1500px; margin:0 auto; width:100%; min-width:0; min-height:calc(100vh - 32px); display:flex; flex-direction:column; }
.topbar { position:relative; display:flex; align-items:center; gap:12px; min-height:46px; margin-bottom:16px; flex:0 0 auto; min-width:0; }
.title-row { display:flex; align-items:flex-end; gap:12px; flex:0 0 auto; min-width:0; }
.title { font-size:22px; font-weight:700; }
.datepicker { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:4px 6px; white-space:nowrap; max-width:100%; }
.datepicker button { background:transparent; border:none; color:var(--text); cursor:pointer; font-size:17px; width:34px; height:34px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
.datepicker button:hover { background:var(--border); }
.datepicker button:disabled { opacity:.35; cursor:not-allowed; }
.datepicker .date-label { font-size:16px; font-weight:600; width:160px; text-align:center; cursor:pointer; padding:3px 8px; border-radius:8px; white-space:nowrap; }
.datepicker .date-label:hover { background:var(--border); }
.calendar { position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--card); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); padding:12px; width:330px; max-width:calc(100vw - 24px); z-index:999; display:none; }
.calendar.open { display:block; }
.cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.cal-head button { background:transparent; border:none; color:var(--text); font-size:20px; width:30px; height:30px; border-radius:8px; cursor:pointer; }
.cal-head button:hover { background:var(--border); }
.cal-title { font-weight:700; font-size:14px; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-grid .dow { text-align:center; color:var(--muted); font-size:12px; padding:5px 0; }
.cal-grid .day { text-align:center; padding:6px 0; font-size:13px; border-radius:8px; cursor:pointer; }
.cal-grid .day:hover { background:var(--border); }
.cal-grid .day.sel { background:var(--primary); color:#fff; }
.cal-grid .day.disabled { color:var(--muted); opacity:.35; cursor:not-allowed; }
.cal-grid .day.blank { pointer-events:none; }
.list { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:14px; min-height:0; overflow:auto; padding:10px 2px 24px; }
.loading { color:var(--muted); text-align:center; padding:44px 0; font-size:16px; }
.model-group { width:100%; flex:1 1 0; min-width:0; min-height:112px; display:flex; flex-direction:column; background:var(--card); border:1px solid color-mix(in srgb, var(--border) 54%, var(--muted) 46%); border-radius:18px; padding:16px 14px 14px; box-shadow:0 4px 12px rgba(15,23,42,.07), 0 1px 2px rgba(15,23,42,.04); }
.model-group-head { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; margin:0 0 12px; }
.model-group-title { display:flex; align-items:center; gap:8px; min-width:0; max-width:calc(100% - 72px); color:var(--text); font-size:15px; line-height:1.2; font-weight:800; letter-spacing:.01em; padding:5px 10px 5px 7px; border:1px solid color-mix(in srgb, var(--primary) 34%, var(--border)); border-radius:10px; background:color-mix(in srgb, var(--primary) 7%, var(--card)); box-shadow:0 2px 8px color-mix(in srgb, var(--primary) 8%, transparent); }
.model-group-icon { width:18px; height:18px; flex:0 0 18px; display:grid; place-items:center; border-radius:50%; background:var(--card); overflow:hidden; }
.model-group-icon img { width:15px; height:15px; display:block; object-fit:contain; }
.model-group-count { flex:0 0 auto; color:var(--muted); font-size:11px; white-space:nowrap; padding:3px 7px; border:1px solid var(--border); border-radius:8px; background:transparent; }
.model-group-rows { flex:1 1 auto; min-width:0; min-height:42px; display:flex; flex-direction:column; gap:0; }
.row { position:relative; z-index:0; overflow:visible; flex:1 1 42px; min-width:0; min-height:42px; background:transparent; border:0; border-radius:0; padding:10px 2px; display:flex; align-items:center; gap:10px; transition:background .16s ease; }
.row + .row { border-top:1px solid color-mix(in srgb, var(--border) 78%, transparent); }
.row:hover { z-index:1; background:color-mix(in srgb, var(--primary) 6%, transparent); }
.row .name { width:150px; flex:0 1 150px; min-width:0; max-width:100%; font-weight:600; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.timeline { position:relative; z-index:1; flex:1 1 auto; display:flex; gap:1px; align-items:stretch; min-width:0; overflow:visible; }
.timeline .bar { position:relative; z-index:1; flex:1 1 0; min-width:1px; height:18px; border-radius:2px; transition:transform .12s ease; }
.bar.ok { background:var(--ok); }
.bar.fail { background:var(--fail); }
.bar.warn { background:#f59e0b; }
.bar.empty { background:var(--empty); }
.bar:hover { z-index:2; transform:scale(1.15); }
.bar:active { transform:scale(1.2); }
.stats { flex:0 0 112px; min-width:0; text-align:right; white-space:nowrap; }
.stats .avail { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stats .avail.good { color:#059669; } .stats .avail.warn { color:#b45309; } .stats .avail.bad { color:#dc2626; }
.legend { display:flex; gap:10px; font-size:13px; color:var(--muted); align-items:center; white-space:nowrap; flex-wrap:nowrap; margin:0; padding-bottom:1px; }
.legend span { display:flex; align-items:center; gap:4px; }
.legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
.legend i.ok { background:var(--ok); } .legend i.fail { background:var(--fail); } .legend i.warn { background:#f59e0b; } .legend i.empty { background:var(--empty); }
#tooltip { position:fixed; z-index:9999; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.45; box-shadow:0 8px 24px rgba(0,0,0,.18); pointer-events:none; display:none; min-width:180px; max-width:300px; }
#tooltip .tt-time { color:var(--muted); font-size:12px; white-space:nowrap; }
#tooltip .tt-model { color:var(--text); font-size:13px; font-weight:600; white-space:nowrap; }
#tooltip .tt-status { font-weight:700; font-size:15px; margin:3px 0; }
#tooltip .tt-status.ok { color:#059669; } #tooltip .tt-status.fail { color:#dc2626; } #tooltip .tt-status.warn { color:#b45309; } #tooltip .tt-status.empty { color:var(--muted); }
#tooltip .tt-lat { font-weight:700; font-size:13px; }
#tooltip .tt-err { color:#dc2626; font-size:12px; margin-top:6px; word-break:break-all; white-space:pre-wrap; max-height:70px; overflow-y:auto; }
.maintenance { flex:1 1 auto; display:flex; align-items:center; justify-content:center; }
.maint-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:36px 44px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.08); max-width:460px; }
.maint-icon { width:60px; height:60px; margin:0 auto 16px; border-radius:16px; background:rgba(20,184,166,.12); display:flex; align-items:center; justify-content:center; }
.maint-icon svg { width:30px; height:30px; color:var(--primary); animation:spin 1.4s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@media (max-width:900px) {
  body { padding:12px; }
  .topbar { min-height:82px; align-items:flex-start; }
  .title-row { flex-direction:column; align-items:flex-start; gap:8px; min-width:0; }
  .datepicker { top:auto; bottom:0; left:0; transform:none; max-width:100%; }
  .legend { flex-wrap:wrap; }
  .row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; row-gap:8px; column-gap:8px; padding:9px 2px; }
  .row .name { width:auto; max-width:100%; flex:none; min-width:0; padding-top:0; }
  .stats { grid-column:auto; margin-left:0; min-width:0; flex:none; }
  .timeline { grid-column:1 / -1; flex:none; width:100%; min-width:0; min-height:18px; }
  .model-group { min-height:108px; }
}
@media (max-width:640px) {
  .model-group { padding:14px 12px 12px; border-radius:15px; }
  .model-group-head { align-items:flex-start; margin-bottom:10px; }
  .model-group-title { max-width:calc(100% - 64px); font-size:14px; padding:5px 9px 5px 7px; }
  .model-group-icon { width:18px; height:18px; flex-basis:18px; }
  .model-group-icon img { width:15px; height:15px; }
  .row { grid-template-columns:minmax(0,1fr); padding:9px 2px; overflow:visible; }
  .row .name { width:100%; }
  .stats { grid-column:1; text-align:left; }
  .timeline { min-height:18px; }
}
.maint-title { font-size:20px; font-weight:700; margin-bottom:8px; }
.maint-desc { color:var(--muted); font-size:14px; line-height:1.8; margin-bottom:18px; }
.maint-retry { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:9px 20px; font-size:14px; font-weight:600; cursor:pointer; }
.maint-retry:hover { background:var(--primary-600); }
.maint-hint { margin-top:12px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
    <div class="topbar">
    <div class="title-row">
      <div class="title">模型可用性监控</div>
      <div class="legend"><span><i class="ok"></i>正常</span><span><i class="warn"></i>缓慢</span><span><i class="fail"></i>失败</span><span><i class="empty"></i>未监控</span></div>
    </div>
    <div class="datepicker">
      <button id="prev" title="前一天">‹</button>
      <div class="date-label" id="dateLabel"></div>
      <button id="next" title="后一天">›</button>
      <button id="today" title="今天(重置)"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" style="width:18px;height:18px"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg></button>
      <div class="calendar" id="calendar"></div>
    </div>
  </div>
<div class="list" id="list"></div>
  <div class="maintenance" id="maintenance" style="display:none">
    <div class="maint-card">
      <div class="maint-icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg></div>
      <div class="maint-title">系统维护中</div>
      <div class="maint-desc">模型可用性监控正在维护升级，数据将在服务恢复后自动加载。<br>为您带来的不便敬请谅解。</div>
      <button class="maint-retry" onclick="load()">立即重试</button>
      <div class="maint-hint">将在 <span id="maintCd">10</span> 秒后自动重试</div>
    </div>
  </div>
</div>
<div id="tooltip"></div>

let slotData = [];

let curSlow = 10000;

function fmt(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; }
function weekday(d){ return '周'+'日一二三四五六'[d.getDay()]; }
function todayStart(){ const t=new Date(); t.setHours(0,0,0,0); return t; }

/**
 * 将文本转义为可安全输出的 HTML，同时覆盖元素内容和属性上下文。
 * @param {string} s 需要转义的原始文本。
 * @return {string} 返回转义后的安全文本；空值按空字符串处理。
 */
function escHtml(s){
  // 归一化空值，避免数据缺失时触发异常
  const value = String(s ?? '');
  // 按顺序转义 HTML 特殊字符，确保内容与属性上下文都安全
  return value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/**
 * 根据单个槽位状态计算展示用的样式与中文文案。
 * @param {object} info 槽位监控信息。
 * @return {Array<string>} 返回 [样式类名, 展示文案]。
 */
function statusText(info){
  if(info.ok===null) return ['empty','未监控'];
  if(info.ok) return (info.lat>curSlow ? ['warn','缓慢'] : ['ok','正常']);
  return ['fail','失败'];
}

/**
 * 根据模型名称开头的连续英文字母提取模型系列。
 * @param {string} model 模型名称。
 * @return {string} 返回小写系列前缀；无法识别时返回“其他”。
 */
function getModelSeries(model){
  // 规范化模型名称，避免空值或非字符串数据导致正则匹配异常
  const name = String(model ?? '').trim();
  // 只取模型名称最前面的连续英文字母，例如 qwen3.7-plus 提取为 qwen
  const matched = name.match(/^[A-Za-z]+/);
  // 无英文前缀的模型统一归入其他系列
  return matched ? matched[0].toLowerCase() : '其他';
}

 * @param {string} series 模型系列前缀。
 * @return {string} 返回官方展示名称；未知系列保留原前缀。
 */
function getModelSeriesLabel(series){
  // 使用固定映射统一展示主流模型系列的官方称呼
  const labels = { qwen:'Qwen', gpt:'GPT', glm:'GLM', deepseek:'DeepSeek' };
  // 未配置映射的系列使用原始前缀，避免丢失未知模型信息
  return labels[series] || series;
}

/**
 * 按模型系列整理监控模型，保持接口返回的原始顺序。
 * @param {Array<object>} models 接口返回的模型监控数据。
 * @return {Array<object>} 返回带系列标识和模型列表的分组数据。
 */
function groupModelsBySeries(models){
  // 使用 Map 保持系列首次出现顺序，避免改变现有模型排序
  const groups = new Map();
  models.forEach(function(model){
    // 提取当前模型的系列前缀
    const series = getModelSeries(model.model);
    // 首次遇到系列时创建分组容器
    if(!groups.has(series)) groups.set(series, []);
    // 将模型追加到对应系列
    groups.get(series).push(model);
  });
  // 将 Map 转换为便于模板拼接的数组结构
  return Array.from(groups, function(entry){ return { series: entry[0], models: entry[1] }; });
}

let retryTimer = null;
/**
 * 切换到维护提示状态，并启动倒计时自动重试。
 * @return {void} 无返回值，直接更新页面状态。
 */
function showMaintenance(){
  const list=document.getElementById('list');
  const maint=document.getElementById('maintenance');
  list.style.display='none';
  maint.style.display='flex';
  let n = 10;
  const cd = document.getElementById('maintCd');
  if (retryTimer) clearInterval(retryTimer);
  retryTimer = setInterval(function(){ n--; if (cd) cd.textContent = n; if (n <= 0) load(); }, 1000);
}
/**
 * 隐藏维护提示并停止自动重试计时器。
 * @return {void} 无返回值，直接更新页面状态。
 */
function hideMaintenance(){
  const list=document.getElementById('list');
  const maint=document.getElementById('maintenance');
  maint.style.display='none';
  list.style.display='flex';
  if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
}

/**
 * 加载指定日期的模型状态数据，并渲染时间线与可用率。
 * @return {Promise<void>} 无返回值；失败时切换到维护提示。
 */
async function load(){
  const ds=fmt(current);
  const dateLabel=document.getElementById('dateLabel');
  dateLabel.textContent=ds+' '+weekday(current);
  const today=todayStart();
  document.getElementById('next').disabled = current>=today;
  document.getElementById('prev').disabled = false;
  const list=document.getElementById('list');
  hideMaintenance();
  list.innerHTML='<div class="loading">加载中…</div>';
  const url='api/status?date='+ds;
  let data;
  try {
    // 请求当日模型状态数据
    const r = await fetch(url);
    // 校验 HTTP 响应状态
    if(!r.ok) throw new Error('http '+r.status);
    // 解析服务端返回的 JSON 数据
    data = await r.json();
    // 校验响应结构，避免异常数据进入渲染流程
    if(!data || !Array.isArray(data.models)) throw new Error('bad data');
    // 读取慢请求阈值
    curSlow = data.slow_ms || 10000;
  } catch(e) {
    // 记录加载失败原因，并切换到维护提示
    console.error(e);
    showMaintenance();
    return;
  }
  let html='', gidx=0;
  slotData=[];
  // 先按英文前缀整理模型系列，再分别渲染圆角矩形分组容器
  groupModelsBySeries(data.models).forEach(function(group){
    const safeSeries = escHtml(group.series);
    const safeSeriesLabel = escHtml(getModelSeriesLabel(group.series));
    const seriesIcon = getModelSeriesIcon(group.series);
    const safeSeriesIcon = escHtml(seriesIcon);
    let rowsHtml='';
    // 渲染系列内的每个模型行，保留原有状态柱和提示数据逻辑
    group.models.forEach(function(m){
      const s=m.slots.filter(x=>x.ok!==null);
      const ok=s.filter(x=>x.ok).length;
      const rate=s.length? (ok/s.length*100):0;
      const availCls= rate>=90?'good':(rate>=60?'warn':'bad');
      let bars='';
      m.slots.forEach(function(x){
        // 根据探测结果生成正常、缓慢、失败或未监控状态
        const cls = x.ok===null?'empty':(x.ok ? (x.latency_ms>curSlow?'warn':'ok') : 'fail');
        // 记录槽位信息，供悬停提示和点击复制使用
        const info = { model: m.model, time: x.time, ok: (x.ok===null?null:x.ok), lat: x.latency_ms, err: (!x.ok && x.message) ? x.message.trim() : '' };
        slotData.push(info);
        bars+='<span class="bar '+cls+'" data-i="'+gidx+'"></span>';
        gidx++;
      });
      // 转义模型名，保证 title 属性和元素内容两处上下文均安全
      const safeModel = escHtml(m.model);
      rowsHtml+='<div class="row"><div class="name" data-model="'+safeModel+'">'+safeModel+'</div><div class="timeline">'+bars+'</div>'+
        '<div class="stats"><div class="avail '+availCls+'">可用率 '+(s.length? rate.toFixed(1):0)+'%</div></div></div>';
    });
    // 输出系列标题与数量，明确圆角矩形边界包裹同系列模型
    html+='<section class="model-group" style="flex-grow:'+group.models.length+'" aria-label="模型系列 '+safeSeriesLabel+'">'+
      '<div class="model-group-head"><div class="model-group-title">'+(safeSeriesIcon?'<span class="model-group-icon"><img src="'+safeSeriesIcon+'" alt="模型图标"></span>':'')+safeSeriesLabel+'</div><div class="model-group-count">'+group.models.length+' 个模型</div></div>'+
      '<div class="model-group-rows">'+rowsHtml+'</div></section>';
  });
  list.innerHTML=html;
}

/**
 * 在指定柱条附近渲染提示框，并根据视口边界自动调整位置。
 * @param {HTMLElement} bar 触发提示的柱条元素。
 * @param {string} html 已经过安全转义的提示内容。
 * @return {void} 无返回值，直接更新提示框 DOM。
 */
function placeTip(bar, html){
  const tip = document.getElementById('tooltip');
  tip.innerHTML = html;
  tip.style.display='block';
  const rect = bar.getBoundingClientRect();
  const th = tip.offsetHeight;
  let left = rect.left + rect.width/2;
  let top = rect.top - 8;
  let transform = 'translate(-50%, -100%)';
  if(rect.top - th - 8 < 0){ top = rect.bottom + 8; transform = 'translate(-50%, 0)'; }
  tip.style.left = left+'px';
  tip.style.top = top+'px';
  tip.style.transform = transform;
}

/**
 * 判断模型名称是否因容器宽度不足而实际发生文本截断。
 * @param {HTMLElement} nameEl 模型名称元素。
 * @return {boolean} 文本被省略时返回 true，否则返回 false。
 */
function isModelNameTruncated(nameEl){
  // 比较内容实际宽度与可视宽度，确认浏览器确实显示了省略号
  return nameEl.scrollWidth > nameEl.clientWidth;
}

/**
 * 根据槽位数据生成并显示监控详情提示框。
 * @param {HTMLElement} bar 触发提示的柱条元素。
 * @return {void} 无返回值，直接更新监控详情提示框。
 */
function showTip(bar){
  const info = slotData[Number(bar.dataset.i)] || {};
  const [stCls, stTxt] = statusText(info);
  let html = '<div class="tt-time">'+escHtml(info.time)+'</div><div class="tt-status '+stCls+'">'+stTxt+'</div>';
  if(info.lat!==null && info.lat!==undefined) html += '<div class="tt-lat">延迟 '+info.lat+'ms</div>';
  if(!info.ok && info.err) html += '<div class="tt-err">'+escHtml(info.err)+'</div>';
  placeTip(bar, html);
}

/**
 * 将槽位详情格式化为适合复制到剪贴板的纯文本。
 * @param {object} info 槽位监控信息。
 * @return {string} 返回格式化后的复制文本。
 */
function copyInfo(info){
  const [stCls, stTxt] = statusText(info);
  let txt = '模型：'+info.model+'\n时间：'+info.time+'\n状态：'+stTxt;
  if(info.lat!==null && info.lat!==undefined) txt += '\n延迟：'+info.lat+'ms';
  if(!info.ok && info.err) txt += '\n错误：'+info.err;
  return txt;
}
/**
 * 在剪贴板 API 不可用时使用隐藏输入框兜底复制文本。
 * @param {string} txt 需要复制的内容。
 * @return {void} 无返回值，复制结果由浏览器执行。
 */
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}
/**
 * 复制文本到剪贴板，并自动处理浏览器兼容性兜底。
 * @param {string} txt 需要复制的内容。
 * @return {Promise<void>} 返回复制完成后的异步结果。
 */
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){ return navigator.clipboard.writeText(txt).catch(function(){ fallbackCopy(txt); }); }
  try{ fallbackCopy(txt); return Promise.resolve(); }catch(e){ return Promise.reject(e); }
}

/**
 * 显示统一的“已复制”提示，并在短暂延时后自动隐藏。
 * @param {HTMLElement} anchor 提示框定位所依附的元素。
 * @return {void} 无返回值，直接更新提示框显示状态。
 */
function showCopiedTip(anchor){
  // 清理旧的隐藏计时，避免新提示被旧计时器提前关闭
  if(hideTimer){ clearTimeout(hideTimer); hideTimer=null; }
  // 在点击目标附近显示统一的已复制提示
  placeTip(anchor, '<div class="tt-status ok">已复制</div>');
  // 延时隐藏提示框，保持与监控点位复制反馈一致
  hideTimer=setTimeout(function(){
    tipEl.style.display='none';
    hideTimer=null;
  }, 1200);
}

document.getElementById('dateLabel').onclick=function(e){ e.stopPropagation(); toggleCalendar(); };
document.addEventListener('click', function(e){ if(calOpen && !e.target.closest('.datepicker')){ calOpen=false; document.getElementById('calendar').classList.remove('open'); } });

document.getElementById('prev').onclick=function(){ const t=new Date(current); t.setDate(t.getDate()-1); current=t; load(); };
document.getElementById('next').onclick=function(){ const t=new Date(current); t.setDate(t.getDate()+1); current=t; load(); };
document.getElementById('today').onclick=function(){ current=todayStart(); load(); };

// 悬停显示、移出收起、点击复制
const tipEl=document.getElementById('tooltip');
const HOVER_DELAY = 100;
document.addEventListener('mouseover', function(e){
  const bar=e.target.closest('.bar');
  const name=e.target.closest('.name');
  const target=bar || (name && isModelNameTruncated(name) ? name : null);
  // 忽略非监控点位、非截断模型名称和同一元素内部的鼠标移动
  if(!target || (e.relatedTarget && target.contains(e.relatedTarget))) return;
  // 清理上一次提示的隐藏与显示计时，确保只响应当前元素
  if(hideTimer){ clearTimeout(hideTimer); hideTimer=null; }
  if(hoverTimer){ clearTimeout(hoverTimer); hoverTimer=null; }
  // 记录当前悬停元素，等待短暂停留后再显示自定义提示
  hoverTarget=target;
  hoverTimer=setTimeout(function(){
    // 校验目标仍是当前悬停元素且尚未被页面重绘移除
    if(hoverTarget===target && document.contains(target)){
      if(target.classList.contains('bar')) showTip(target);
      else if(isModelNameTruncated(target)) showModelNameTip(target);
    }
    hoverTimer=null;
  }, HOVER_DELAY);
});
document.addEventListener('mouseout', function(e){
  const bar=e.target.closest('.bar');
  const name=e.target.closest('.name');
  const target=bar || (name && isModelNameTruncated(name) ? name : null);
  // 离开元素并未进入其子元素时，取消待显示提示并隐藏已显示提示
  if(!target || (e.relatedTarget && target.contains(e.relatedTarget))) return;
  if(hoverTarget===target) hoverTarget=null;
  if(hoverTimer){ clearTimeout(hoverTimer); hoverTimer=null; }
  if(hideTimer){ clearTimeout(hideTimer); hideTimer=null; }
  tipEl.style.display='none';
});
document.addEventListener('click', function(e){
  const b=e.target.closest('.bar');
  if(b){
    // 查询当前监控点位详情并复制完整槽位信息
    const info = slotData[Number(b.dataset.i)] || {};
    copyText(copyInfo(info));
    // 复用统一的已复制提示逻辑
    showCopiedTip(b);
    return;
  }
  const name=e.target.closest('.name');
  if(name){
    // 复制模型名称原文，不受页面省略显示影响
    copyText(name.dataset.model || name.textContent || '');
    // 复用统一的已复制提示逻辑
    showCopiedTip(name);
  }
});

/**
 * 渲染日历面板内容，并绑定月份切换与日期选择事件。
 * @return {void} 无返回值，直接更新日历 DOM。
 */
function renderCalendar(){
  const cal = document.getElementById('calendar');
  const today = todayStart();
  const first = new Date(viewYear, viewMonth, 1);
  const startDow = first.getDay();
  const offset = (startDow + 6) % 7; // 周一开头
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  // 根据视图年月生成日历头部与日期网格
  let html = '<div class="cal-head"><button id="calPrev">‹</button><div class="cal-title">'+viewYear+'年'+(viewMonth+1)+'月</div><button id="calNext">›</button></div>';
  html += '<div class="cal-grid">';
  ['一','二','三','四','五','六','日'].forEach(d=> html+='<div class="dow">'+d+'</div>');
  for(let i=0;i<offset;i++) html+='<div class="day blank"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dt = new Date(viewYear, viewMonth, d);
    const isSel = (dt.getFullYear()===current.getFullYear() && dt.getMonth()===current.getMonth() && dt.getDate()===current.getDate());
    const disabled = dt > today;
    html+='<div class="day '+(isSel?'sel ':'')+(disabled?'disabled':'')+'" data-d="'+d+'">'+d+'</div>';
  }
  html += '</div>';
  cal.innerHTML = html;
  // 切换上一月；阻止冒泡，避免旧按钮被重建后被外层监听误判为面板外点击
  document.getElementById('calPrev').onclick=function(e){ e.stopPropagation(); viewMonth--; if(viewMonth<0){viewMonth=11;viewYear--;} renderCalendar(); };
  // 切换下一月；保持日历面板继续打开
  document.getElementById('calNext').onclick=function(e){ e.stopPropagation(); viewMonth++; if(viewMonth>11){viewMonth=0;viewYear++;} renderCalendar(); };
  // 绑定可选日期，选择后更新当前日期并关闭面板
  cal.querySelectorAll('.day:not(.blank):not(.disabled)').forEach(function(el){
    el.onclick=function(){ const d=Number(el.dataset.d); current=new Date(viewYear, viewMonth, d); calOpen=false; document.getElementById('calendar').classList.remove('open'); load(); };
  });
}

/**
 * 切换日历面板显示状态；打开时按当前日期重置视图年月。
 * @return {void} 无返回值，直接更新面板状态与样式。
 */
function toggleCalendar(){
  // 翻转日历面板开启状态
  calOpen = !calOpen;
  // 打开面板时同步当前日期对应的视图年月
  if(calOpen){ const d=new Date(current); viewYear=d.getFullYear(); viewMonth=d.getMonth(); renderCalendar(); }
  // 按状态更新面板显隐
  document.getElementById('calendar').classList.toggle('open', calOpen);
}

document.addEventListener('DOMContentLoaded', function(){ load(); });
if(timer) clearInterval(timer); timer=setInterval(load, 30000);
</script>
<script>
// 构造 08:00 至 22:00 的本地模拟监控数据，便于预览页面独立运行。
const __previewModels = [
  {model:'gpt-5.4', slots:[]},
  {model:'gpt-5.5', slots:[]},
  {model:'gpt-5.6-sol', slots:[]},
  {model:'gpt-5.6-terra', slots:[]},
  {model:'qwen3.7-flash', slots:[]},
  {model:'qwen3.7-plus', slots:[]}
];
// 按 5 分钟生成包含 08:00 与 22:00 在内的 169 个监控点位。
__previewModels.forEach(function(model, modelIndex){
  for(let index=0; index<=168; index++){
    const totalMinutes=8*60+index*5;
    const ok=(index+modelIndex)%11!==0;
    model.slots.push({
      time:String(Math.floor(totalMinutes/60)).padStart(2,'0')+':'+String(totalMinutes%60).padStart(2,'0'),
      ok:ok,
      latency_ms:ok ? 1800+((index*970+modelIndex*460)%11500) : null,
      message:ok ? '' : '模拟失败'
    });
  }
});
// 仅拦截预览页状态接口请求，其他请求仍交给原生 fetch。
const __realFetch=window.fetch.bind(window);
window.fetch=function(url, options){
  if(String(url).startsWith('api/status')){
    return Promise.resolve(new Response(JSON.stringify({models:__previewModels,slow_ms:10000}), {status:200,headers:{'Content-Type':'application/json'}}));
  }
  return __realFetch(url, options);
};
</script>
