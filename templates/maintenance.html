<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>系统维护中</title>
<style>
:root { --primary:#14b8a6; --primary-600:#0d9488; --bg:#f5f7fa; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0; }
.dark { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --border:#334155; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; font-size:16px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:40px 48px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.08); max-width:480px; }
.icon { width:64px; height:64px; margin:0 auto 20px; border-radius:16px; background:rgba(20,184,166,.12); display:flex; align-items:center; justify-content:center; }
.icon svg { width:32px; height:32px; color:var(--primary); animation:spin 1.4s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
h1 { font-size:22px; margin-bottom:10px; }
p { color:var(--muted); font-size:14px; line-height:1.8; margin-bottom:22px; }
.retry-btn { background:var(--primary); color:#fff; border:none; border-radius:10px; padding:10px 22px; font-size:14px; font-weight:600; cursor:pointer; }
.retry-btn:hover { background:var(--primary-600); }
.hint { margin-top:14px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div class="icon"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg></div>
  <h1>系统维护中</h1>
  <p>模型可用性监控正在维护升级，服务将在稍后自动恢复。<br>为您带来的不便敬请谅解。</p>
  <button class="retry-btn" onclick="location.reload()">立即重试</button>
  <div class="hint">页面将在 <span id="cd">30</span> 秒后自动刷新</div>
</div>
<script>
let n = 30;
setInterval(function(){ n--; var el = document.getElementById('cd'); if (el) el.textContent = n; if (n <= 0) location.reload(); }, 1000);
</script>
</body>
</html>
