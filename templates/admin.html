<!DOCTYPE html>
<html lang="zh" class="__THEME_CLASS__">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型监控管理</title>
<style>
:root{--primary:#14b8a6;--primary-600:#0d9488;--bg:#f5f7fa;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#dbe4ec;--soft:#f8fafc;--ok:#10b981;--danger:#ef4444;--warn:#f59e0b;--shadow:0 7px 18px rgba(15,23,42,.07)}
.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--soft:#172235;--shadow:0 8px 22px rgba(0,0,0,.2)}
*{box-sizing:border-box;margin:0;padding:0}html{background:var(--bg)}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:18px;font-size:14px}.shell{width:min(100%,1220px);margin:0 auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 18px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(20,184,166,.22);flex:0 0 auto}.mark svg{width:21px;height:21px}.title-wrap{min-width:0}.eyebrow{color:var(--primary-600);font-size:11px;font-weight:800;letter-spacing:.12em;margin-bottom:3px}.dark .eyebrow{color:#5eead4}.title{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:.01em}.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}.button,.icon-button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 13px;font:inherit;font-weight:700;cursor:pointer;transition:.16s}.button:hover,.icon-button:hover{border-color:var(--primary);color:var(--primary-600);background:var(--soft)}.button.primary{border-color:var(--primary);background:var(--primary);color:#fff}.button.primary:hover{background:var(--primary-600);color:#fff}.button.danger{color:var(--danger)}.button.small{padding:7px 10px;font-size:12px}.icon-button{width:38px;height:38px;padding:0;display:grid;place-items:center}.icon-button svg{width:18px;height:18px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}.stat,.panel{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:14px 16px}.stat-label{font-size:12px;color:var(--muted);margin-bottom:7px}.stat-value{font-size:22px;font-weight:800}.stat-note{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.85fr);align-items:start;gap:14px}.panel{padding:17px}.panel+.panel{margin-top:14px}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}.panel-title{font-size:16px;font-weight:800}.panel-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-top:3px}.vendors{display:grid;gap:12px}.vendor-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--soft)}.vendor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}.vendor-title{display:flex;align-items:center;gap:9px;min-width:0}.vendor-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(20,184,166,.13);flex:0 0 auto}.vendor-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vendor-key{font-size:11px;color:var(--muted);margin-left:4px;font-weight:500}.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select{width:100%;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);padding:0 10px;font:inherit;outline:none;min-width:0}input:focus,select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(20,184,166,.13)}input[type=checkbox]{width:17px;height:17px;accent-color:var(--primary);padding:0}.inline-field{display:flex;align-items:center;gap:8px;height:38px}.inline-field label{font-size:12px;color:var(--muted);font-weight:700}.key-status{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--muted);font-size:12px}.key-status.ready{color:var(--ok)}.key-status i{width:7px;height:7px;border-radius:50%;background:currentColor}.vendor-editor{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);display:none}.vendor-editor.open{display:block}.editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:11px}.models{display:grid;gap:8px;margin-top:12px}.model-row{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(120px,1fr) 82px auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--border);border-radius:11px;background:var(--card);min-width:0}.model-row.is-off{opacity:.62}.model-id{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.model-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.model-toggle{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);font-size:12px}.model-actions{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:11px}.add-model{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1fr) 70px auto;gap:8px;margin-top:10px}.settings{display:grid;gap:12px}.windows{display:grid;gap:8px}.window-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}.window-row button{height:38px}.section-label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:-4px}.status-line{font-size:12px;line-height:1.7;color:var(--muted);padding:10px 11px;border-radius:10px;background:var(--soft);border:1px solid var(--border)}.notice{position:fixed;right:18px;bottom:18px;width:min(360px,calc(100vw - 36px));padding:12px 14px;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:11px;background:var(--card);box-shadow:0 12px 28px rgba(15,23,42,.16);font-size:13px;line-height:1.5;z-index:30;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.notice.show{opacity:1;transform:none}.notice.error{border-left-color:var(--danger)}.notice.warn{border-left-color:var(--warn)}.loading{padding:45px;text-align:center;color:var(--muted)}.spinner{display:inline-block;width:15px;height:15px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .75s linear infinite;vertical-align:-3px;margin-right:6px}.key-input-row{display:flex;align-items:center;gap:8px;min-width:0}.key-input-row input{flex:1;min-width:0}.field-hint{font-size:11px;color:var(--muted);line-height:1.5}.test-result{display:none;margin-top:10px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--muted);font-size:12px;line-height:1.5}.test-result.show{display:block}.test-result.ok{border-color:rgba(16,185,129,.38);color:var(--ok);background:rgba(16,185,129,.08)}.test-result.error{border-color:rgba(239,68,68,.38);color:var(--danger);background:rgba(239,68,68,.08)}.button:disabled{opacity:.55;cursor:not-allowed;pointer-events:none}@keyframes spin{to{transform:rotate(360deg)}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:650px){body{padding:12px}.topbar{align-items:flex-start}.title{font-size:20px}.top-actions{gap:5px}.top-actions .button{padding:8px 9px;font-size:12px}.summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:12px}.panel{padding:13px}.form-grid,.model-row,.add-model{grid-template-columns:1fr}.model-actions{justify-content:flex-start}.window-row{grid-template-columns:1fr 1fr}.window-row button{grid-column:1/-1}.vendor-head{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start}}
</style></head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 17.5V6.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path stroke-linecap="round" d="M7.5 15.5h2m2.5 0h4.5M7.5 11.5h9m-9-4h5"/></svg></div><div class="title-wrap"><div class="eyebrow">配置中心</div><h1 class="title">模型监控管理</h1></div></div><div class="top-actions"><a class="button" href="/model-monitor">返回监控</a><button id="logoutButton" class="button" type="button">退出登录</button></div></header>
<section id="summary" class="summary" aria-label="配置概览"><div class="stat"><div class="stat-label">启用厂商</div><div id="vendorCount" class="stat-value">—</div><div class="stat-note">当前参与监控</div></div><div class="stat"><div class="stat-label">启用模型</div><div id="modelCount" class="stat-value">—</div><div class="stat-note">当前参与探测</div></div><div class="stat"><div class="stat-label">配置版本</div><div id="generation" class="stat-value">—</div><div class="stat-note">保存后即时生效</div></div><div class="stat"><div class="stat-label">最后更新</div><div id="updatedAt" class="stat-value" style="font-size:15px;padding-top:4px">—</div><div class="stat-note">运行时配置快照</div></div></section>
<main id="app" class="layout"><section><div class="panel"><div class="panel-head"><div><h2 class="panel-title">厂商与模型</h2><p class="panel-desc">为不同厂商配置独立地址和密钥；停用会保留历史数据。</p></div><button id="addVendorButton" class="button primary small" type="button">新增厂商</button></div><div id="vendors" class="vendors"><div class="loading"><span class="spinner"></span>正在读取配置…</div></div></div></section><aside><div class="panel"><div class="panel-head"><div><h2 class="panel-title">监控设置</h2><p class="panel-desc">调整监控时间段和探测判定参数。</p></div></div><form id="settingsForm" class="settings"><div class="section-label">监控时间段</div><div id="windows" class="windows"></div><button id="addWindowButton" class="button small" type="button">添加时间段</button><div class="form-grid"><div class="field"><label for="interval">探测间隔（分钟）</label><input id="interval" type="number" min="1" step="1" required></div><div class="field"><label for="slowThreshold">慢响应阈值（毫秒）</label><input id="slowThreshold" type="number" min="0" step="100" required></div></div><button class="button primary" type="submit">保存监控设置</button><div id="settingsStatus" class="status-line">—</div></form></div><div class="panel"><div class="panel-head"><div><h2 class="panel-title">使用提示</h2><p class="panel-desc">配置修改会在下一轮探测中生效。</p></div></div><div class="status-line">API 密钥只显示配置状态，不会回显原文。模型 ID 用于匹配历史记录，修改显示名称不会影响历史数据。</div></div></aside></main>
</div><div id="notice" class="notice" role="status" aria-live="polite"></div>
<script>
let configState=null;
const csrfKey='model-monitor-csrf';

/** 解析服务端响应并统一处理 HTTP 错误。 @param {Response} response HTTP 响应。 @return {Promise<Object>} JSON 数据。 */
async function readJson(response){const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch(_){data={}}if(response.status===401){sessionStorage.removeItem(csrfKey);location.href='/model-monitor-admin/login';throw new Error('登录会话已过期，请重新登录。')}if(!response.ok)throw new Error(data.error||data.message||'请求失败，请稍后重试。');return data}
/** 发起管理接口请求，自动附加会话和防跨站请求令牌。 @param {string} url 接口地址。 @param {RequestInit} options 请求选项。 @return {Promise<Object>} 接口数据。 */
async function api(url,options={}){const opts={credentials:'same-origin',...options,headers:{...(options.headers||{})}};if(opts.body&&!opts.headers['Content-Type'])opts.headers['Content-Type']='application/json';const token=sessionStorage.getItem(csrfKey);if(token)opts.headers['X-CSRF-Token']=token;return readJson(await fetch(url,opts))}
/** 显示短暂的操作反馈。 @param {string} text 提示内容。 @param {string} type 提示类型。 @return {void} 更新提示元素。 */
function notify(text,type='success'){const el=document.getElementById('notice');el.textContent=text;el.className='notice show '+(type==='error'?'error':type==='warn'?'warn':'');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.className='notice',3600)}
/** 转义动态文本，防止配置内容被当作 HTML 执行。 @param {*} value 原始值。 @return {string} 安全文本。 */
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/** 从兼容字段中读取启用状态。 @param {Object} item 配置对象。 @return {boolean} 是否启用。 */
function enabled(item){return item.enabled!==false&&item.enabled!==0&&item.enabled!=='0'}
/** 规范化服务端配置结构，兼容接口返回空列表或不同命名。 @param {Object} raw 原始配置。 @return {Object} 页面使用的配置。 */
function normalizeConfig(raw){const settings=raw.settings||{};return{...raw,settings:{monitor_windows:settings.monitor_windows||settings.windows||[{start:'08:00',end:'22:00'}],probe_interval_min:Number(settings.probe_interval_min??settings.probe_interval_minutes??5),slow_threshold_ms:Number(settings.slow_threshold_ms??settings.slow_ms??10000)},vendors:Array.isArray(raw.vendors)?raw.vendors:[]}}
/** 生成时间段编辑行。 @param {Object} item 时间段对象。 @param {number} index 行号。 @return {string} HTML 片段。 */
function windowHtml(item,index){return '<div class="window-row" data-window-index="'+index+'"><div class="field"><label>开始时间</label><input class="window-start" type="time" value="'+esc(item.start||'08:00')+'" required></div><div class="field"><label>结束时间</label><input class="window-end" type="time" value="'+esc(item.end||'22:00')+'" required></div><button class="button small danger remove-window" type="button" aria-label="删除此时间段">删除</button></div>'}
/** 渲染监控设置表单。 @return {void} 更新设置区域。 */
function renderSettings(){const s=configState.settings;document.getElementById('windows').innerHTML=(s.monitor_windows.length?s.monitor_windows:[{start:'08:00',end:'22:00'}]).map(windowHtml).join('');document.getElementById('interval').value=s.probe_interval_min;document.getElementById('slowThreshold').value=s.slow_threshold_ms;document.getElementById('settingsStatus').textContent='当前配置版本：'+(configState.generation??'—')+'，修改后立即保存并生效。'}
/** 构造厂商卡片及其模型编辑控件。 @param {Object} vendor 厂商配置。 @return {string} 厂商卡片 HTML。 */
function vendorHtml(vendor){const models=Array.isArray(vendor.models)?vendor.models:[],keyConfigured=Boolean(vendor.api_key_configured),modelOptions='<option value="">自动选择首个模型</option>'+models.map(model=>'<option value="'+esc(model.model_key||model.model||'')+'">'+esc(model.display_name||model.model_key||model.model||'')+'</option>').join('');return '<article class="vendor-card" data-vendor="'+esc(vendor.vendor_key)+'" data-api-key-configured="'+(keyConfigured?'true':'false')+'"><div class="vendor-head"><div class="vendor-title"><i class="vendor-dot"></i><div class="vendor-name">'+esc(vendor.display_name||vendor.vendor_key)+' <span class="vendor-key">'+esc(vendor.vendor_key)+'</span></div></div><div class="actions"><span class="key-status '+(keyConfigured?'ready':'')+'"><i></i>'+(keyConfigured?'已配置密钥':'未配置密钥')+'</span><label class="inline-field"><input class="vendor-enabled" type="checkbox" '+(enabled(vendor)?'checked':'')+'>启用</label><button class="button small edit-vendor" type="button">编辑配置</button><button class="button small test-vendor" type="button">测试连接</button><button class="button small danger delete-vendor" type="button">删除</button></div></div><div class="vendor-details"><div class="status-line">地址：'+esc(vendor.base_url||'未设置')+' · 模型：'+models.length+' 个</div></div><div class="vendor-editor"><div class="form-grid"><div class="field"><label>厂商标识（不可修改）</label><input class="vendor-key-input" value="'+esc(vendor.vendor_key)+'" readonly></div><div class="field"><label>厂商显示名称</label><input class="vendor-display" value="'+esc(vendor.display_name||'')+'" required></div><div class="field full"><label>基础地址</label><input class="vendor-url" value="'+esc(vendor.base_url||'')+'" placeholder="请输入 http 或 https 地址" required></div><div class="field full"><label>厂商接口密钥（留空保持不变）</label><div class="key-input-row"><input class="vendor-key-secret" type="password" autocomplete="new-password" placeholder="留空表示保持现有密钥"><button class="button small danger clear-api-key" type="button" '+(keyConfigured?'':'disabled')+'>清除密钥</button></div><div class="field-hint">输入新值会替换现有密钥；清除操作需要确认，并在保存后生效。</div></div><div class="field full"><label>测试模型（可选）</label><select class="test-model">'+modelOptions+'</select><div class="field-hint">留空时自动使用该厂商下排序最靠前的模型；测试不会写入历史记录。</div></div></div><div class="editor-actions"><button class="button small cancel-vendor" type="button">取消</button><button class="button primary small save-vendor" type="button">保存厂商</button></div><div class="test-result" aria-live="polite"></div></div><div class="models">'+(models.length?models.map(modelHtml).join(''):'<div class="empty">该厂商下暂无模型</div>')+'</div><div class="add-model"><input class="new-model-key" placeholder="模型标识，例如 qwen3.7-plus"><input class="new-model-name" placeholder="显示名称（可选）"><input class="new-model-order" type="number" value="0" aria-label="模型排序"><button class="button primary small add-model-button" type="button">添加模型</button></div></article>'}
/** 构造单个模型编辑行。 @param {Object} model 模型配置。 @return {string} 模型行 HTML。 */
function modelHtml(model){return '<div class="model-row '+(enabled(model)?'':'is-off')+'" data-model="'+esc(model.model_key||model.model)+'"><input class="model-id" value="'+esc(model.model_key||model.model||'')+'" readonly title="'+esc(model.model_key||model.model||'')+'"><input class="model-display" value="'+esc(model.display_name||'')+'" placeholder="显示名称（可选）"><label class="model-toggle"><input class="model-enabled" type="checkbox" '+(enabled(model)?'checked':'')+'>启用</label><div class="model-actions"><button class="button small save-model" type="button">保存</button><button class="button small danger delete-model" type="button">删除</button></div></div>'}
/** 渲染所有厂商和模型。 @return {void} 更新厂商区域与统计信息。 */
function render(){const vendors=document.getElementById('vendors');vendors.innerHTML=configState.vendors.length?configState.vendors.map(vendorHtml).join(''):'<div class="empty">暂无厂商配置，请先新增厂商。</div>';const activeV=configState.vendors.filter(enabled),activeM=activeV.reduce((n,v)=>n+(v.models||[]).filter(enabled).length,0);document.getElementById('vendorCount').textContent=activeV.length;document.getElementById('modelCount').textContent=activeM;document.getElementById('generation').textContent=configState.generation??'—';document.getElementById('updatedAt').textContent=formatDate(configState.settings.updated_at||configState.updated_at||configState.updatedAt||'');renderSettings()}
/** 格式化配置更新时间。 @param {string} value 原始时间。 @return {string} 简短时间文本。 */
function formatDate(value){if(!value)return'—';const d=new Date(value);return Number.isNaN(d.getTime())?String(value).slice(0,16).replace('T',' '):d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
/** 读取登录会话并加载当前配置。 @return {Promise<void>} 页面初始化结果。 */
async function loadPage(){try{const session=await api('/api/admin/session');if(!session.authenticated){location.href='/model-monitor-admin/login';return}if(session.csrf_token)sessionStorage.setItem(csrfKey,session.csrf_token);configState=normalizeConfig(await api('/api/admin/config'));render()}catch(error){if(error.message)notify(error.message,'error')}}
/** 收集并校验时间段和监控参数。 @return {Object|null} 可提交的设置对象。 */
function collectSettings(){const rows=[...document.querySelectorAll('.window-row')];const windows=rows.map(row=>({start:row.querySelector('.window-start').value,end:row.querySelector('.window-end').value}));if(!windows.length)return notify('至少保留一个监控时间段。','error'),null;if(windows.some(w=>!w.start||!w.end||w.start>=w.end))return notify('每个时间段必须满足开始时间早于结束时间。','error'),null;const interval=Number(document.getElementById('interval').value),slow=Number(document.getElementById('slowThreshold').value);if(!Number.isInteger(interval)||interval<=0)return notify('探测间隔必须是大于 0 的整数。','error'),null;if(!Number.isFinite(slow)||slow<0)return notify('慢响应阈值不能小于 0。','error'),null;return{monitor_windows:windows,probe_interval_min:interval,slow_threshold_ms:slow}}
/** 保存监控设置并刷新配置快照。 @return {Promise<void>} 保存结果。 */
async function saveSettings(event){event.preventDefault();const body=collectSettings();if(!body)return;if(!confirm('确定保存监控设置吗？保存后将在下一轮探测生效。'))return;try{await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(body)});notify('监控设置已保存，下一轮探测生效。');await loadPage()}catch(error){notify(error.message,'error')}}
/** 读取厂商编辑表单并提交更新。 @param {HTMLElement} card 厂商卡片。 @return {Promise<void>} 保存结果。 */
async function saveVendor(card){const key=card.dataset.vendor,display=card.querySelector('.vendor-display').value.trim(),url=card.querySelector('.vendor-url').value.trim(),secret=card.querySelector('.vendor-key-secret').value,clearApiKey=card.dataset.clearApiKey==='true';if(!display||!url)return notify('厂商名称和基础地址不能为空。','error');const body={vendor_key:key,display_name:display,base_url:url,enabled:card.querySelector('.vendor-enabled').checked};if(secret)body.api_key=secret;if(clearApiKey)body.clear_api_key=true;if(!confirm('确定保存厂商“'+display+'”的配置吗？'))return;try{await api('/api/admin/vendors/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify(body)});notify('厂商配置已保存。');await loadPage()}catch(error){notify(error.message,'error')}}
/** 测试厂商连接并展示脱敏结果。 @param {HTMLElement} card 厂商卡片。 @return {Promise<void>} 测试结果。 */
async function testVendor(card){const editor=card.querySelector('.vendor-editor');editor.classList.add('open');const result=card.querySelector('.test-result'),modelKey=card.querySelector('.test-model').value,baseUrl=card.querySelector('.vendor-url').value.trim(),apiKey=card.querySelector('.vendor-key-secret').value;if(!baseUrl)return notify('请先填写基础地址。','error');result.className='test-result show';result.textContent='正在测试连接，请稍候……';try{const body={base_url:baseUrl};if(modelKey)body.model_key=modelKey;if(apiKey)body.api_key=apiKey;const data=await api('/api/admin/vendors/'+encodeURIComponent(card.dataset.vendor)+'/test',{method:'POST',body:JSON.stringify(body)});const status=data.status_code===null||data.status_code===undefined?'未返回':data.status_code,latency=data.latency_ms===null||data.latency_ms===undefined?'未知':data.latency_ms+' 毫秒';result.className='test-result show '+(data.ok?'ok':'error');result.textContent=(data.ok?'测试成功：':'测试失败：')+(data.message||'连接结果未知')+'；延迟 '+latency+'；响应状态 '+status+'。'}catch(error){result.className='test-result show error';result.textContent='测试失败：'+(error.message||'请求失败，请稍后重试。')}}
/** 清除厂商接口密钥，保存前要求二次确认。 @param {HTMLElement} card 厂商卡片。 @return {void} 更新待提交状态。 */
function clearApiKey(card){const button=card.querySelector('.clear-api-key'),input=card.querySelector('.vendor-key-secret');if(card.dataset.clearApiKey==='true'){card.dataset.clearApiKey='false';button.textContent='清除密钥';input.disabled=false;notify('已取消清除密钥。','warn');return}if(!confirm('确定清除该厂商的接口密钥吗？清除并保存后，后续探测将无法使用该密钥。'))return;card.dataset.clearApiKey='true';input.value='';input.disabled=true;button.textContent='撤销清除';notify('已标记清除密钥，请点击“保存厂商”后生效。','warn')}
/** 新增厂商并刷新页面。 @return {Promise<void>} 新增结果。 */
async function addVendor(){const display=prompt('请输入厂商显示名称：','新厂商');if(display===null)return;const key=prompt('请输入厂商标识（小写字母、数字、中划线或下划线）：','new-vendor');if(key===null)return;const url=prompt('请输入基础地址：','https://api.example.com');if(url===null)return;const secret=prompt('请输入 API 密钥（可留空）：','')||'';try{await api('/api/admin/vendors',{method:'POST',body:JSON.stringify({vendor_key:key.trim(),display_name:display.trim(),base_url:url.trim(),api_key:secret,enabled:true,sort_order:0})});notify('厂商已新增。');await loadPage()}catch(error){notify(error.message,'error')}}
/** 新增模型并刷新厂商卡片。 @param {HTMLElement} card 厂商卡片。 @return {Promise<void>} 新增结果。 */
async function addModel(card){const key=card.querySelector('.new-model-key').value.trim(),name=card.querySelector('.new-model-name').value.trim(),order=Number(card.querySelector('.new-model-order').value||0);if(!key)return notify('请输入模型 ID。','error');try{await api('/api/admin/models',{method:'POST',body:JSON.stringify({vendor_key:card.dataset.vendor,model_key:key,display_name:name,enabled:true,sort_order:Number.isFinite(order)?order:0})});notify('模型已新增。');await loadPage()}catch(error){notify(error.message,'error')}}
/** 保存单个模型的显示名称和启用状态。 @param {HTMLElement} row 模型行。 @return {Promise<void>} 保存结果。 */
async function saveModel(row){const key=row.dataset.model;if(!confirm('确定保存模型“'+key+'”的配置吗？'))return;try{await api('/api/admin/models/'+encodeURIComponent(key),{method:'PUT',body:JSON.stringify({model_key:key,display_name:row.querySelector('.model-display').value.trim(),enabled:row.querySelector('.model-enabled').checked})});notify('模型配置已保存。');await loadPage()}catch(error){notify(error.message,'error')}}
/** 删除模型配置，删除前明确提示会移除历史记录。 @param {HTMLElement} row 模型行。 @return {Promise<void>} 删除结果。 */
async function deleteModel(row){const key=row.dataset.model;try{const preview=await api('/api/admin/models/'+encodeURIComponent(key)+'/delete-preview');if(!confirm('确定删除模型“'+key+'”？将删除 '+preview.model_count+' 个模型配置和 '+preview.history_count+' 条历史探测记录，删除前会自动创建数据库备份，且删除后不可通过页面恢复。'))return;await api('/api/admin/models/'+encodeURIComponent(key),{method:'DELETE'});notify('模型已删除。');await loadPage()}catch(error){notify(error.message,'error')}}
/** 删除厂商配置，删除前提示关联模型与历史记录影响。 @param {HTMLElement} card 厂商卡片。 @return {Promise<void>} 删除结果。 */
async function deleteVendor(card){const key=card.dataset.vendor,name=card.querySelector('.vendor-name').childNodes[0].textContent.trim();try{const preview=await api('/api/admin/vendors/'+encodeURIComponent(key)+'/delete-preview');if(!confirm('确定删除厂商“'+name+'”？将同时删除 '+preview.model_count+' 个模型配置和 '+preview.history_count+' 条历史探测记录，删除前会自动创建数据库备份，且删除后不可通过页面恢复。'))return;await api('/api/admin/vendors/'+encodeURIComponent(key),{method:'DELETE'});notify('厂商已删除。');await loadPage()}catch(error){notify(error.message,'error')}}
/** 登出当前管理会话。 @return {Promise<void>} 登出结果。 */
async function logout(){try{await api('/api/admin/logout',{method:'POST',body:'{}'})}catch(_){}sessionStorage.removeItem(csrfKey);location.href='/model-monitor-admin/login'}
/** 绑定管理页上的事件代理。 @return {void} 注册交互事件。 */
function bindEvents(){document.getElementById('settingsForm').addEventListener('submit',saveSettings);document.getElementById('addVendorButton').addEventListener('click',addVendor);document.getElementById('addWindowButton').addEventListener('click',()=>{const rows=document.getElementById('windows');rows.insertAdjacentHTML('beforeend',windowHtml({start:'08:00',end:'22:00'},rows.children.length))});document.getElementById('logoutButton').addEventListener('click',logout);document.addEventListener('click',async event=>{const remove=event.target.closest('.remove-window');if(remove){const rows=document.querySelectorAll('.window-row');if(rows.length<=1)return notify('至少保留一个监控时间段。','error');remove.closest('.window-row').remove();return}const card=event.target.closest('.vendor-card');if(!card)return;if(event.target.closest('.edit-vendor')){card.querySelector('.vendor-editor').classList.add('open');return}if(event.target.closest('.cancel-vendor')){card.querySelector('.vendor-editor').classList.remove('open');return}if(event.target.closest('.save-vendor'))return saveVendor(card);if(event.target.closest('.test-vendor'))return testVendor(card);if(event.target.closest('.clear-api-key'))return clearApiKey(card);if(event.target.closest('.delete-vendor'))return deleteVendor(card);if(event.target.closest('.add-model-button'))return addModel(card);const row=event.target.closest('.model-row');if(row&&event.target.closest('.save-model'))return saveModel(row);if(row&&event.target.closest('.delete-model'))return deleteModel(row)})}
bindEvents();loadPage();
</script></body></html>
