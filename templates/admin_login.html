<!DOCTYPE html>
<html lang="zh" class="__THEME_CLASS__">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型监控管理登录</title>
<style>
:root{--primary:#14b8a6;--primary-600:#0d9488;--bg:#f5f7fa;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--danger:#ef4444;--shadow:0 14px 34px rgba(15,23,42,.1)}.dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--shadow:0 14px 34px rgba(0,0,0,.28)}*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:var(--bg)}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);padding:20px;display:grid;place-items:center;font-size:15px}.login-shell{width:min(100%,430px)}.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}.brand-mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(20,184,166,.24)}.brand-mark svg{width:24px;height:24px}.brand-name{font-size:21px;font-weight:800;letter-spacing:.02em}.login-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:var(--shadow)}.eyebrow{color:var(--primary-600);font-size:12px;font-weight:800;letter-spacing:.12em;margin-bottom:8px;text-transform:uppercase}.dark .eyebrow{color:#5eead4}h1{font-size:25px;line-height:1.25;margin-bottom:9px}.intro{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:24px}.field{display:grid;gap:7px;margin-bottom:16px}.field label{font-size:13px;font-weight:700}.field input{width:100%;height:44px;border:1px solid var(--border);border-radius:11px;padding:0 13px;background:transparent;color:var(--text);font:inherit;outline:none;transition:border-color .16s,box-shadow .16s}.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(20,184,166,.15)}.primary-btn{width:100%;height:45px;border:0;border-radius:11px;background:var(--primary);color:#fff;font:inherit;font-weight:800;cursor:pointer;transition:background .16s,transform .16s}.primary-btn:hover{background:var(--primary-600)}.primary-btn:active{transform:translateY(1px)}.primary-btn:disabled{opacity:.6;cursor:wait}.message{min-height:22px;margin:0 0 10px;color:var(--danger);font-size:13px;line-height:1.6}.hint{margin-top:18px;text-align:center;color:var(--muted);font-size:12px}@media(max-width:480px){body{padding:14px}.login-card{padding:24px 20px;border-radius:17px}h1{font-size:23px}}
</style></head>
<body><main class="login-shell"><div class="brand"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 17.5V6.5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path stroke-linecap="round" d="M7.5 15.5h2m2.5 0h4.5M7.5 11.5h9m-9-4h5"/></svg></div><div class="brand-name">模型监控</div></div><section class="login-card" aria-labelledby="page-title"><div class="eyebrow">安全登录</div><h1 id="page-title">进入配置管理</h1><p class="intro">管理厂商、模型和监控参数。登录凭据由服务端环境配置保护。</p><form id="loginForm" novalidate><div class="field"><label for="username">管理员账号</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">管理员密码</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><div id="message" class="message" role="alert" aria-live="polite"></div><button id="submitButton" class="primary-btn" type="submit">登录管理页</button></form><div class="hint">会话将在一段时间无操作后自动失效</div></section></main>
<script>
/** 提交管理员凭据并根据服务端结果进入管理页。 @return {Promise<void>} 无返回值。 */
async function submitLogin(event){event.preventDefault();const form=event.currentTarget,button=document.getElementById('submitButton'),message=document.getElementById('message'),username=form.username.value.trim(),password=form.password.value;if(!username||!password){message.textContent='请输入管理员账号和密码。';return}button.disabled=true;button.textContent='正在登录…';message.textContent='';try{const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username,password})});const data=await readJson(response);if(!response.ok||data.ok===false)throw new Error(data.error||'用户名或密码错误');if(data.csrf_token)sessionStorage.setItem('model-monitor-csrf',data.csrf_token);window.location.href='/model-monitor-admin'}catch(error){message.textContent=error.message||'登录失败，请稍后重试。'}finally{button.disabled=false;button.textContent='登录管理页'}}
/** 解析 JSON 响应，兼容服务端返回空响应的情况。 @param {Response} response @return {Promise<Object>} 响应对象。 */
async function readJson(response){const text=await response.text();if(!text)return{};try{return JSON.parse(text)}catch(_){return{error:'服务端返回了无法解析的响应。'}}}document.getElementById('loginForm').addEventListener('submit',submitLogin);
</script></body></html>
